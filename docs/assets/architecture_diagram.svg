<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="70" rx="12" fill="#151d2e" stroke="#2d3b5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="30" y="34" fill="#60a5fa" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">METROGUARD AI — MASTER SYSTEM ARCHITECTURE</text>
    <text x="30" y="55" fill="#f8fafc" font-size="18" font-weight="bold">Multi-Signal Predictive Maintenance &amp; Prescriptive Decision Command Center</text>
    <text x="1050" y="44" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="end">Asset: APU-TR-03 | MetroPT-3</text>
  </g>

  <!-- 1. Telemetry Ingestion Layer -->
  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="1080" height="75" rx="12" fill="#151d2e" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="75" rx="3" fill="#3b82f6"/>
    <text x="25" y="28" fill="#93c5fd" font-size="11" font-family="monospace" font-weight="bold">LAYER 1 — TELEMETRY INGESTION &amp; STREAMING REPLAY</text>
    <text x="25" y="52" fill="#ffffff" font-size="15" font-weight="bold">15 Raw Telemetry Channels</text>
    <text x="280" y="52" fill="#94a3b8" font-size="12">• 7 Analogue Sensors (Pressures, Temps, Current)</text>
    <text x="640" y="52" fill="#94a3b8" font-size="12">• 8 Digital Control States (Solenoids, Valves)</text>
    <text x="960" y="52" fill="#94a3b8" font-size="12">• 10s Rate Replay</text>
  </g>

  <!-- Connector Line 1 -->
  <path d="M 600 210 L 600 240" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="596,238 600,246 604,238" fill="#3b82f6"/>

  <!-- 2. Preprocessing & Feature Engineering Layer -->
  <g transform="translate(60, 245)">
    <rect x="0" y="0" width="1080" height="75" rx="12" fill="#151d2e" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="75" rx="3" fill="#8b5cf6"/>
    <text x="25" y="28" fill="#c084fc" font-size="11" font-family="monospace" font-weight="bold">LAYER 2 — PREPROCESSING &amp; ROLLING FEATURE EXTRACTION</text>
    <text x="25" y="52" fill="#ffffff" font-size="15" font-weight="bold">65 Engineered Time-Series Features</text>
    <text x="340" y="52" fill="#94a3b8" font-size="12">• Rolling Means &amp; Volatilities (1m, 5m)</text>
    <text x="640" y="52" fill="#94a3b8" font-size="12">• Differentials &amp; State Transitions (diff_1m, diff_5m)</text>
    <text x="980" y="52" fill="#94a3b8" font-size="12">• 0% Leakage</text>
  </g>

  <!-- Branching Connector -->
  <path d="M 600 320 L 600 340 L 330 340 L 330 360" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="326,358 330,366 334,358" fill="#8b5cf6"/>
  <path d="M 600 340 L 870 340 L 870 360" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="866,358 870,366 874,358" fill="#8b5cf6"/>

  <!-- 3. Dual-Tier AI Inference Layer -->
  <!-- Left Box: XGBoost -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="525" height="110" rx="12" fill="#151d2e" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#3b82f6"/>
    <text x="25" y="28" fill="#60a5fa" font-size="11" font-family="monospace" font-weight="bold">TIER 1 — SUPERVISED CLASSIFIER (65 FEATURES)</text>
    <text x="25" y="52" fill="#ffffff" font-size="15" font-weight="bold">XGBoost Known-Failure Detector</text>
    <text x="25" y="74" fill="#94a3b8" font-size="12">Target: P(Failure within 30 min | x) • Threshold τ = 0.10</text>
    <text x="25" y="94" fill="#38bdf8" font-size="11" font-family="monospace">Event #1 Recall: 98.78% | Event #2 Recall: 97.57%</text>
  </g>

  <!-- Right Box: Isolation Forest -->
  <g transform="translate(615, 365)">
    <rect x="0" y="0" width="525" height="110" rx="12" fill="#151d2e" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#06b6d4"/>
    <text x="25" y="28" fill="#22d3ee" font-size="11" font-family="monospace" font-weight="bold">TIER 2 — UNSUPERVISED ANOMALY (65 FEATURES)</text>
    <text x="25" y="52" fill="#ffffff" font-size="15" font-weight="bold">Isolation Forest Outlier Detector</text>
    <text x="25" y="74" fill="#94a3b8" font-size="12">150 Trees • 99th %-tile Threshold τ = 0.5040 • 0-100 Severity</text>
    <text x="25" y="94" fill="#2dd4bf" font-size="11" font-family="monospace">Unseen Summer Event #4 Recall: 33.15% (Oil +3.69σ)</text>
  </g>

  <!-- Converging Connectors -->
  <path d="M 330 475 L 330 495 L 600 495 L 600 515" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 870 475 L 870 495 L 600 495" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="596,513 600,521 604,513" fill="#f59e0b"/>

  <!-- 4. Physical Evidence & Hybrid Decision Engine Layer -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1080" height="95" rx="12" fill="#151d2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#f59e0b"/>
    <text x="25" y="26" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="bold">LAYER 3 — PHYSICAL EVIDENCE ATTRIBUTION &amp; HYBRID DECISION SYNTHESIS</text>
    <text x="25" y="50" fill="#ffffff" font-size="15" font-weight="bold">Deterministic Hybrid Decision Engine</text>
    <text x="360" y="50" fill="#94a3b8" font-size="12">• Baseline Medians &amp; Z-Scores (|Z| ≥ 2.0σ)</text>
    <text x="690" y="50" fill="#94a3b8" font-size="12">• Persistence Tracking (≥3/5m windows)</text>
    <text x="25" y="76" fill="#fde68a" font-size="11" font-family="monospace">States: NORMAL (Routine) | MONITOR (Advisory) | WARNING (High/Medium) | HIGH RISK (Critical)</text>
  </g>

  <!-- Connector Line 3 -->
  <path d="M 600 615 L 600 635" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="596,633 600,641 604,633" fill="#f43f5e"/>

  <!-- 5. Smart Alerts & Prescriptive Maintenance Recommendations -->
  <g transform="translate(60, 640)">
    <rect x="0" y="0" width="1080" height="95" rx="12" fill="#151d2e" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#f43f5e"/>
    <text x="25" y="26" fill="#fb7185" font-size="11" font-family="monospace" font-weight="bold">LAYER 4 — INTELLIGENT ALERTS &amp; PRESCRIPTIVE MAINTENANCE WORKFLOW</text>
    <text x="25" y="50" fill="#ffffff" font-size="15" font-weight="bold">Prescriptive Depot Decision Support</text>
    <text x="350" y="50" fill="#94a3b8" font-size="12">• Deduplicated Incident Tracking</text>
    <text x="600" y="50" fill="#94a3b8" font-size="12">• Operator Lifecycle (Active/Ack/Resolved)</text>
    <text x="25" y="76" fill="#fecdd3" font-size="11" font-family="monospace">Prescriptive Actions: Directed Mechanical Remediation &amp; Interactive 4-Point Inspection Checklists</text>
  </g>

  <!-- Connector Line 4 -->
  <path d="M 600 735 L 600 755" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="596,753 600,761 604,753" fill="#10b981"/>

  <!-- 6. FastAPI Backend & React Dashboard Command Center -->
  <g transform="translate(60, 760)">
    <rect x="0" y="0" width="1080" height="95" rx="12" fill="#151d2e" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#10b981"/>
    <text x="25" y="26" fill="#34d399" font-size="11" font-family="monospace" font-weight="bold">LAYER 5 — PRESENTATION &amp; OPERATOR COMMAND CENTER</text>
    <text x="25" y="50" fill="#ffffff" font-size="15" font-weight="bold">FastAPI Backend + React 18 / Vite Unified SPA</text>
    <text x="440" y="50" fill="#94a3b8" font-size="12">• 18 REST APIs</text>
    <text x="560" y="50" fill="#94a3b8" font-size="12">• 6 Dedicated Industrial Command Pages</text>
    <text x="25" y="76" fill="#a7f3d0" font-size="11" font-family="monospace">Views: / (Overview) | /monitoring (Live) | /risk (Radar) | /sensors (Signals) | /performance (ML) | /case-study (Reports)</text>
  </g>
</svg>
